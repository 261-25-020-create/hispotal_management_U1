<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Hospital Management System</h1>
            <p>Static Data Dashboard deployed via GitHub Pages</p>
        </header>

        <section class="card">
            <div class="table-header">
                <h2>Patient Records</h2>
                <!-- Search Bar Input -->
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Search patient by name or ID...">
            </div>

            <table id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Room</th>
                        <th>Doctor ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loaded dynamically from CSV -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // Load data from CSV file
        async function loadPatientData() {
            try {
                // Tries 1_Patient.csv, falls back to 1_Patient.csv.txt if needed
                let response = await fetch('1_Patient.csv');
                if (!response.ok) {
                    response = await fetch('1_Patient.csv.txt');
                }
                
                const data = await response.text();
                const rows = data.trim().split('\n').slice(1); // Skip header row
                const tbody = document.querySelector('#patientTable tbody');
                tbody.innerHTML = ''; // Clear table

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 8) {
                        const tr = document.createElement('tr');
                        cols.forEach(col => {
                            const td = document.createElement('td');
                            td.textContent = col.trim();
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    }
                });
            } catch (err) {
                console.error('Error loading CSV data:', err);
            }
        }

        // Live Search Filter Function
        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const rows = document.querySelectorAll('#patientTable tbody tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        // Run on page load
        loadPatientData();
    </script>
</body>
</html>
