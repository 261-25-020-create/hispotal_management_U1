<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Hospital Management System</h1>
            <p>Static Data Dashboard deployed via GitHub Pages</p>
        </header>

        <section class="card">
            <h2>Patient Records</h2>
            <table id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Room</th>
                        <th>Doctor ID</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loaded dynamically from CSV -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // Reads 1_Patient.csv and displays records
        fetch('1_Patient.csv')
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').slice(1);
                const tbody = document.querySelector('#patientTable tbody');
                
                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 9) {
                        const tr = document.createElement('tr');
                        cols.forEach(col => {
                            const td = document.createElement('td');
                            td.textContent = col.trim();
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    }
                });
            });
    </script>
</body>
</html>
